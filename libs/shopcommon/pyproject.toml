[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopcommon"
version = "0.1.0"
description = "Shared plumbing for the shop microservices: config, auth, DB, metrics, logging."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.8",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "pydantic[email]>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shopcommon*"]
