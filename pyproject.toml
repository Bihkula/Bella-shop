# Repo-wide tooling config. Each service is installed and tested independently.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["k8s", "deploy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "E402", "E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["shopcommon", "app"]
