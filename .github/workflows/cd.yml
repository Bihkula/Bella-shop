# Build changed services -> push to GitHub Container Registry (ghcr.io) ->
# bump image tags in the dev overlay -> Argo CD notices the commit and deploys
# to shop-dev. No AWS credentials needed: it only uses the built-in GITHUB_TOKEN.
#
# After the very first run, make each package public once (Packages tab on your
# GitHub profile -> shop-<service> -> Package settings -> Change visibility),
# so the EKS nodes can pull the images without credentials.
name: CD

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "libs/**"
      - "frontend/**"
      - "docker/**"
  workflow_dispatch:
    inputs:
      all:
        description: Rebuild every service
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
      registry: ${{ steps.pick.outputs.registry }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:     ["services/auth/**", "libs/**", "docker/**"]
            products: ["services/products/**", "libs/**", "docker/**"]
            orders:   ["services/orders/**", "libs/**", "docker/**"]
            payments: ["services/payments/**", "libs/**", "docker/**"]
            frontend: ["frontend/**"]
      - id: pick
        run: |
          # ghcr.io image names must be lowercase.
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.all }}" = "true" ]; then
            echo 'services=["auth","products","orders","payments","frontend"]' >> "$GITHUB_OUTPUT"
          else
            echo 'services=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io with GITHUB_TOKEN
    strategy:
      fail-fast: false  # keep building the other images if one fails
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    env:
      IMAGE: ${{ needs.changes.outputs.registry }}/shop-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      # Re-running a workflow for the same commit shouldn't rebuild/overwrite.
      - id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"; echo "Image already published; skipping build"
          fi
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.found != 'true'
        with:
          context: .
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || 'docker/python-service.Dockerfile' }}
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/amd64
          push: true
          provenance: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          # Links the package to this repo on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Vulnerability scan (fails on CRITICAL)
        if: steps.exists.outputs.found != 'true'
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: table

  deploy-dev:
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the tag bump
    steps:
      - uses: actions/checkout@v5
      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
      - name: Bump image tags in dev overlay
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          REGISTRY: ${{ needs.changes.outputs.registry }}
        run: |
          tag="sha-${GITHUB_SHA::7}"
          cd k8s/overlays/dev
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            kustomize edit set image "shop-$svc=$REGISTRY/shop-$svc:$tag"
          done
          git diff --stat
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --cached --quiet && { echo "nothing to change"; exit 0; }
          git commit -m "deploy(dev): ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Summary
        run: |
          echo "### Deployed to dev :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Services: \`${{ needs.changes.outputs.services }}\` at \`sha-${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Images: \`${{ needs.changes.outputs.registry }}/shop-<service>\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Argo CD will sync **shop-dev** within ~3 minutes." >> "$GITHUB_STEP_SUMMARY"
