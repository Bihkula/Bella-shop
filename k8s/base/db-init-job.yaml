# Creates one database per service (database-per-service pattern) on whichever
# Postgres DB_HOST points at: the in-cluster one in dev, RDS in prod.
# Runs as an Argo CD Sync hook after secrets/postgres and before the services.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-init
        app.kubernetes.io/component: api  # allowed to reach postgres by NetworkPolicy
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: db-init
          image: postgres:16-alpine
          envFrom:
            - configMapRef: { name: shop-config }
          env:
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: DB_PASSWORD } }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export PGHOST="$DB_HOST" PGPORT="$DB_PORT" PGUSER="$DB_USER" PGSSLMODE="$DB_SSLMODE" PGDATABASE=postgres
              until pg_isready -t 2; do echo "waiting for $DB_HOST"; sleep 3; done
              for db in auth products orders payments; do
                if psql -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1; then
                  echo "database $db exists"
                else
                  psql -c "CREATE DATABASE \"$db\"" && echo "created $db"
                fi
              done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
