# Storefront + API gateway. The same image runs in docker-compose and Kubernetes
# because both expose the services under the names auth/products/orders/payments.

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; connect-src 'self' https://api.stripe.com; img-src 'self' data:; style-src 'self'" always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # Service-to-service endpoints are never reachable from the internet.
    location ~ ^/api/[a-z]+/internal/ { return 404; }
    location ~ ^/api/[a-z]+/(metrics|docs|openapi\.json) { return 404; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 15s;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://auth:8000/login;
    }
    location /api/auth/     { proxy_pass http://auth:8000/; }
    location /api/products/ { proxy_pass http://products:8000/; }
    location /api/orders/   { proxy_pass http://orders:8000/; }
    location /api/payments/ { proxy_pass http://payments:8000/; }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
