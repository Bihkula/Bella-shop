# Encrypted gp3 volumes via the EBS CSI driver add-on.
# reclaimPolicy Delete: volumes are removed with their PVCs, so tearing the
# cluster down doesn't leave orphaned (billed) EBS volumes behind.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
